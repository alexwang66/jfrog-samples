name: Flutter Pub Publish To JFrog

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: "Pub package version to publish"
        required: false
        default: "0.1.1"
        type: string

permissions:
  contents: read

env:
  JF_URL: ${{ vars.JFROG_URL_SOLENG_LATEST || 'https://solenglatest.jfrog.io/' }}
  JF_SERVER_ID: solenglatest
  JFROG_PUB_REPO: pub-samples-local
  PUB_HOSTED_URL: https://solenglatest.jfrog.io/artifactory/api/pub/pub-samples-local/
  BUILD_NAME: flutter-jfrog-pub-sample
  BUILD_NUMBER: ${{ github.run_number }}
  PACKAGE_VERSION: ${{ github.event.inputs.package_version || '0.1.1' }}
  JFROG_CLI_USER_AGENT: jfrog-samples-github-actions

jobs:
  publish:
    name: Publish with Flutter pub publish
    runs-on: ubuntu-latest
    env:
      JF_ACCESS_TOKEN: ${{ secrets.SOLENG_LATEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Set up JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_ACCESS_TOKEN: ${{ env.JF_ACCESS_TOKEN }}
        with:
          version: 2.125.0

      - name: Set package version
        run: |
          set -euo pipefail
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PACKAGE_VERSION must be a stable semantic version such as 0.1.1."
            exit 1
          fi
          sed -i -E "s/^version: .*/version: $PACKAGE_VERSION/" pub-samples/pubspec.yaml

      - name: Configure JFrog and Flutter Pub authentication
        run: |
          set -euo pipefail
          if [ -z "${JF_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing SOLENG_LATEST_TOKEN repository secret."
            exit 1
          fi
          jf c add "$JF_SERVER_ID" \
            --url="$JF_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            --interactive=false \
            --overwrite=true
          jf rt ping --server-id "$JF_SERVER_ID"
          flutter pub token add "$PUB_HOSTED_URL" --env-var JF_ACCESS_TOKEN

      - name: Test package
        working-directory: ./pub-samples
        run: |
          set -euo pipefail
          flutter pub get
          flutter test
          flutter analyze

      - name: Publish package with Flutter
        working-directory: ./pub-samples
        run: flutter pub publish --force

      - name: Publish Build Info
        run: |
          set -euo pipefail
          jf rt build-add-git "$BUILD_NAME" "$BUILD_NUMBER" \
            "$GITHUB_WORKSPACE" --server-id "$JF_SERVER_ID"
          jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER" \
            --server-id "$JF_SERVER_ID"

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Flutter Pub publish"
            echo "- Repository: \`$JFROG_PUB_REPO\`"
            echo "- Version: \`$PACKAGE_VERSION\`"
            echo "- Hosted URL: \`$PUB_HOSTED_URL\`"
            echo "- Build Info: [$BUILD_NAME/$BUILD_NUMBER]($JF_URL/ui/builds/$BUILD_NAME/$BUILD_NUMBER)"
          } >> "$GITHUB_STEP_SUMMARY"
