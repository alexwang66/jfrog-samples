name: Build And Deploy Runtime Sample

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-sample.yml"
      - "maven-sample/**"
      - "runtime-sample/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-sample.yml"
      - "maven-sample/**"
      - "runtime-sample/**"
  workflow_dispatch:

env:
  SERVER_ID: soleng
  RUNTIME_SERVER_ID: demo
  MAVEN_VIRTUAL_REPO: alex-maven-virtual
  MAVEN_DEPLOY_REPO: alex-maven-local
  MAVEN_GROUP_PATH: com/example/jfrog
  MAVEN_ARTIFACT_ID: app-boot
  MAVEN_VERSION: 1.0.3
  DOCKER_REPO: docker-local
  IMAGE_NAME: runtime-sample-maven
  BUILD_NAME: Runtime-Maven-Sample-Build
  DOCKER_BUILD_NAME: Runtime-Docker-Image-Build
  K8S_NAMESPACE: default
  K8S_POD_NAME: runtime-sample-maven
  IMAGE_PULL_SECRET: jfrog-docker-config

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      JFROG_URL: ${{ vars.JFROG_URL }}
      IMAGE_REGISTRY: ${{ vars.RUNTIME_JFROG_DOCKER_REGISTRY || 'demo.jfrogchina.com' }}
      IMAGE_TAG: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}
        with:
          oidc-provider-name: alexwang-github

      - name: Configure JFrog CLI
        run: |
          jf c add "$SERVER_ID" \
            --url="${{ vars.JFROG_URL }}" \
            --access-token="${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}" \
            --interactive=false \
            --overwrite=true
          jf c add "$RUNTIME_SERVER_ID" \
            --url="${{ vars.RUNTIME_JFROG_URL || 'https://demo.jfrogchina.com' }}" \
            --access-token="${{ secrets.RUNTIME_ARTIFACTORY_ACCESS_TOKEN }}" \
            --interactive=false \
            --overwrite=true
          jf c use "$SERVER_ID"
          jf rt ping --server-id "$SERVER_ID"
          jf rt ping --server-id "$RUNTIME_SERVER_ID"

      - name: Configure Maven With Artifactory
        run: |
          jf mvnc \
            --repo-resolve-releases="$MAVEN_VIRTUAL_REPO" \
            --repo-resolve-snapshots="$MAVEN_VIRTUAL_REPO" \
            --repo-deploy-releases="$MAVEN_VIRTUAL_REPO" \
            --repo-deploy-snapshots="$MAVEN_VIRTUAL_REPO" \
            --server-id-resolve="$SERVER_ID" \
            --server-id-deploy="$SERVER_ID"

      - name: Build Maven Project
        working-directory: ./maven-sample
        run: |
          jf rt mvn clean package \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_id }}"

      - name: Upload Java Package To Artifactory
        run: |
          WAR_PATH="maven-sample/target/$MAVEN_ARTIFACT_ID-$MAVEN_VERSION.war"
          TARGET_PATH="$MAVEN_DEPLOY_REPO/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT_ID/$MAVEN_VERSION/$MAVEN_ARTIFACT_ID-$MAVEN_VERSION.war"
          jf rt upload "$WAR_PATH" "$TARGET_PATH" \
            --server-id "$SERVER_ID" \
            --build-name "$BUILD_NAME" \
            --build-number "${{ github.run_id }}"

      - name: Publish Maven Build Info
        run: |
          jf rt build-publish "$BUILD_NAME" "${{ github.run_id }}"
          jf bs "$BUILD_NAME" "${{ github.run_id }}" --fail=false || true

      - name: Login To JFrog Docker Registry
        run: |
          jf docker login "$IMAGE_REGISTRY" --server-id "$RUNTIME_SERVER_ID"

      - name: Build Runtime Image
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          docker build \
            --platform linux/amd64 \
            -t "$IMAGE" \
            -t "$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:latest-amd64" \
            -f runtime-sample/Dockerfile \
            .

      - name: Scan Runtime Image
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          jf docker scan "$IMAGE" --server-id "$RUNTIME_SERVER_ID"

      - name: Push Runtime Image
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          jf docker push "$IMAGE" \
            --server-id "$RUNTIME_SERVER_ID" \
            --build-name "$DOCKER_BUILD_NAME" \
            --build-number "${{ github.run_id }}"
          jf docker push "$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:latest-amd64" \
            --server-id "$RUNTIME_SERVER_ID" \
            --build-name "$DOCKER_BUILD_NAME" \
            --build-number "${{ github.run_id }}"

      - name: Publish Docker Build Info
        run: |
          jf rt build-publish "$DOCKER_BUILD_NAME" "${{ github.run_id }}" --server-id "$RUNTIME_SERVER_ID"

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubernetes
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.RUNTIME_KUBECONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Configure Kubernetes Image Pull Secret
        run: |
          kubectl create secret docker-registry "$IMAGE_PULL_SECRET" \
            --namespace "$K8S_NAMESPACE" \
            --docker-server="$IMAGE_REGISTRY" \
            --docker-username="${{ vars.JFROG_DOCKER_USERNAME || 'alexwang' }}" \
            --docker-password="${{ secrets.RUNTIME_ARTIFACTORY_ACCESS_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy Runtime Pod
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          kubectl delete pod "$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" --ignore-not-found=true
          sed "s#demo.jfrogchina.com/docker-local/runtime-sample-maven:1.0.3-amd64#$IMAGE#g" runtime-sample/pod.yaml \
            | kubectl apply --namespace "$K8S_NAMESPACE" -f -
          kubectl wait --for=condition=Ready "pod/$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" --timeout=180s
          kubectl get pod "$K8S_POD_NAME" --namespace "$K8S_NAMESPACE" -o wide

      - name: Build Summary
        if: always()
        run: |
          IMAGE="$IMAGE_REGISTRY/$DOCKER_REPO/$IMAGE_NAME:$IMAGE_TAG"
          JAVA_PACKAGE_PATH="$MAVEN_DEPLOY_REPO/$MAVEN_GROUP_PATH/$MAVEN_ARTIFACT_ID/$MAVEN_VERSION/$MAVEN_ARTIFACT_ID-$MAVEN_VERSION.war"
          JAVA_PACKAGE_URL="${{ vars.JFROG_URL }}/ui/repos/tree/General/$JAVA_PACKAGE_PATH"
          DOCKER_IMAGE_URL="https://$IMAGE_REGISTRY/ui/repos/tree/General/$DOCKER_REPO/$IMAGE_NAME/$IMAGE_TAG"
          BUILD_INFO_URL="${{ vars.JFROG_URL }}/ui/builds/$BUILD_NAME/${{ github.run_id }}"
          DOCKER_BUILD_INFO_URL="https://$IMAGE_REGISTRY/ui/builds/$DOCKER_BUILD_NAME/${{ github.run_id }}"
          echo "### Runtime Maven Sample" >> "$GITHUB_STEP_SUMMARY"
          echo "- Java Package: [$MAVEN_ARTIFACT_ID-$MAVEN_VERSION.war]($JAVA_PACKAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker Image: [$IMAGE]($DOCKER_IMAGE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image Scan: enforced before Kubernetes deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build Info: [$BUILD_NAME/${{ github.run_id }}]($BUILD_INFO_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker Build Info: [$DOCKER_BUILD_NAME/${{ github.run_id }}]($DOCKER_BUILD_INFO_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kubernetes Pod: \`$K8S_NAMESPACE/$K8S_POD_NAME\`" >> "$GITHUB_STEP_SUMMARY"
